<script>
  function handleAuth() {
    const btn = document.getElementById('submit-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">refresh</span><span>Verifying credentials...</span>`;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1400);
  }

  function handleSSO() {
    const btn = event.currentTarget;
    btn.classList.add('opacity-75');
    setTimeout(() => {
      btn.classList.remove('opacity-75');
    }, 800);
  }
